modLoader="javafml"
license="${mod_license}"
issueTrackerURL="${issue_tracker}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL=""
logoFile="logo.png"
credits="${authors}"
authors="${authors}"
description='''
With this mod, you can restore and re-add missing or removed Minecraft crafting recipes.
Con Este Mod Puedes tener recetas Faltentes O Eliminadas De Minecraft
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="jei"
    type="optional"
    versionRange="${jei_version}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="alltheores"
    type="optional"
    versionRange="${ato_version_id}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="geckolib"
    type="optional"
    versionRange="${geckolib_version}"
    ordering="NONE"
    side="BOTH"


[[dependencies.${mod_id}]]
    modId="allthemodium"
    type="optional"
    versionRange="${allthemodium_version}"
    ordering="NONE"
    side="BOTH"